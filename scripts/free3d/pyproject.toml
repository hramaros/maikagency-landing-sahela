[project]
name = "free3d-mcp"
version = "0.1.0"
description = "Free image/text -> 3D (GLB) for the Sahela landing, via open-source models on Hugging Face ZeroGPU Spaces (TRELLIS, FLUX.1-schnell). No paid API, no local GPU."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    # Pin to match the TRELLIS Space's Gradio (5.34.x). gradio_client must be
    # protocol-compatible with the target Space's Gradio version or file I/O and
    # payloads mismatch (surfaces as a server-side "TypeError"). See README.
    "gradio-client==1.10.3",
    "huggingface-hub>=0.25.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
free3d-mcp = "free3d.server:main"
free3d-cli = "free3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["free3d"]
